<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Listagem de Usuários</title>
</head>

<body>
    <main class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="my-5"> Listagem de Usuários</h1>
            <button data-bs-toggle="dialog" data-bs-target="#modalCriarUsuario">Criar Usuário</button>
        </div>

        <table class="table table-striped-columns" data-bs-theme="dark">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">E-mail</th>
                    <th scope="col">Senha</th>
                    <th scope="col">Criado em</th>
                    <th scope="col" class="col-acoes">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>12345</td>
                    <td>12/12/2016</td>
                    <td class="col-acoes">
                        <button class="me-2" data-bs-toggle="dialog"
                            data-bs-target="#modalEditarUsuario">Editar</button>
                        <button class="">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- MODAL EDITAR USUÁRIO -->
    <dialog class="dialog" id="modalEditarUsuario" aria-labelledby="modalEditarUsuarioLabel" data-bs-theme="dark">
        <div class="dialog-header">
            <h2 class="dialog-title" id="modalEditarUsuarioLabel">Editar Usuário</h2>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <form action="">
            <div class="dialog-body d-flex flex-column gap-4">
                <div class="d-flex flex-column">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome">
                </div>
                <div class="d-flex flex-column">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="d-flex flex-column">
                    <label for="senha">Senha</label>
                    <input type="text" name="senha" id="senha">
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Fechar</button>
                <button type="submit" class="btn-solid theme-primary">Salvar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL CRIAR USUÁRIO -->
    <dialog class="dialog" id="modalCriarUsuario" aria-labelledby="modalCriarUsuarioLabel" data-bs-theme="dark">
        <div class="dialog-header">
            <h2 class="dialog-title" id="modalCriarUsuarioLabel">Criar Usuário</h2>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <form action="">
            <div class="dialog-body d-flex flex-column gap-4">
                <div class="d-flex flex-column">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome">
                </div>
                <div class="d-flex flex-column">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="d-flex flex-column">
                    <label for="senha">Senha</label>
                    <input type="text" name="senha" id="senha">
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Fechar</button>
                <button type="submit" class="btn-solid theme-primary">Salvar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
